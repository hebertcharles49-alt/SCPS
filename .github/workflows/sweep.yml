# SWEEP CLOUD — chaque processus laisse un rc, un PID, un hash et un marqueur
# de fin dans sweep_ci/. Les gates restent bloquants ; les artifacts sont
# toujours envoyés pour diagnostiquer un échec.
name: sweep
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "nombre de graines (3+101n)"
        default: "20"
        required: false
      years:
        description: "années par simulation"
        default: "250"
        required: false
      jobs:
        description: "processus parallèles maximum"
        default: "4"
        required: false
  push:
    branches: [ "claude/vibrant-euler-1tgfp3" ]
    paths: [ "ci/sweep_request.txt" ]

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          set -euo pipefail
          make CC=gcc chronicle scps -j"$(nproc)" 2>&1 | tee sweep_build.log

      - name: gates
        run: |
          set -euo pipefail
          mkdir -p sweep_ci
          make CC=gcc test > sweep_ci/gates_test.log 2>&1
          ./scps_viewer --savetest 9 > sweep_ci/gates_savetest_9.log 2>&1
          ./scps_viewer --savetest 7 > sweep_ci/gates_savetest_7.log 2>&1

      - name: sweep
        if: ${{ success() }}
        env:
          SWEEP_SEEDS: ${{ github.event.inputs.seeds || '20' }}
          SWEEP_YEARS: ${{ github.event.inputs.years || '250' }}
          SWEEP_JOBS: ${{ github.event.inputs.jobs || '4' }}
        run: |
          set -euo pipefail
          tools/sweep_run.sh "$SWEEP_SEEDS" "$SWEEP_YEARS" "$SWEEP_JOBS"

      - name: publier le rapport
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "sweep-bot"
          git config user.email "actions@github.com"
          git add sweep_ci/RESULTS.md sweep_ci/manifest.txt sweep_ci/manifest.tsv
          git commit -m "sweep cloud : rapport ($(date -u +%F)) [skip ci]"
          git push

      - name: artifacts de diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sweep-logs
          path: |
            sweep_ci/
            sweep_build.log
          if-no-files-found: warn
          retention-days: 14
